# ==============================================================================
# POLÍTICAS DE ORQUESTRAÇÃO DO HARNESS NEXTCODE (politicas-orquestracao.yaml)
# ==============================================================================
# Regra Arquitetural: Este arquivo DESCREVE os parâmetros declarativos da
# orquestração; o HARNESS em código TypeScript (src/core/) LÊ e APLICA cada
# regra mecanicamente. O orquestrador nunca é uma skill.
# ==============================================================================

# Versão do schema deste arquivo de políticas para validação de compatibilidade no boot.
versao_politica: "1.0.0"

# ------------------------------------------------------------------------------
# 1. MAPEAMENTO DE PAPÉIS PARA SKILLS E SKILLS DE APOIO POR CLUSTER
# ------------------------------------------------------------------------------
papeis:
  # Agente conversacional da Fase 1 (Elicitação): transforma o pedido em Spec com REQ-001...
  elicitador:
    skill_principal: "skills/elicitador/SKILL.md"
    nivel_modelo_padrao: "forte"

  # Agente planejador da Fase 2 (Análise): decompõe a Spec aprovada em Macrobrief, Contratos e Microbriefs.
  analista:
    skill_principal: "skills/analista/SKILL.md"
    nivel_modelo_padrao: "forte"

  # Agentes implementadores da Fase 3 (Execução em Quarentena), especializados por cluster.
  executores:
    core:
      skill_principal: "skills/executor-core/SKILL.md"
      skills_apoio_permitidas:
        - "apoio_dominio_typescript"
    backend:
      skill_principal: "skills/executor-backend/SKILL.md"
      skills_apoio_permitidas:
        - "apoio_api_rest_validation"
        - "apoio_dominio_typescript"
    frontend:
      skill_principal: "skills/executor-frontend/SKILL.md"
      skills_apoio_permitidas:
        - "apoio_ui_web_guidelines"
        - "react_best_practices_critical_high"
        - "ui_ux_pro_max_rules"
        - "taste_skill_publico_selecionado" # Injetada SOMENTE se Jev confirmar página pública
    integration:
      skill_principal: "skills/executor-integration/SKILL.md"
      skills_apoio_permitidas:
        - "apoio_api_rest_validation"

  # Agentes auditores da Fase 4 (Avaliação em Duas Lentes: Cega + Verificação Cruzada).
  avaliadores:
    # Skill base herdada por todos os avaliadores de cluster.
    base_generica: "skills/avaliador/SKILL.md"
    por_cluster:
      core:
        skill_principal: "skills/avaliador-core/SKILL.md"
        herda_de: "skills/avaliador/SKILL.md"
        referencias_obrigatorias: []
      backend:
        skill_principal: "skills/avaliador-backend/SKILL.md"
        herda_de: "skills/avaliador/SKILL.md"
        referencias_obrigatorias: []
      frontend:
        skill_principal: "skills/avaliador-frontend/SKILL.md"
        herda_de: "skills/avaliador/SKILL.md"
        referencias_obrigatorias:
          - "skills/avaliador-frontend/references/web-interface-guidelines-command.md" # Fixado no commit 434b7f91364665f2f733b310ec54809bf8f37937
          - "skills/avaliador-frontend/references/react-best-practices-critical-high.md" # Fixado no commit 063bee94c3f4df8453406c830b0a7df0f2860278
          - "skills/avaliador-frontend/references/ui-ux-pro-max-checklist.md"
          - "skills/avaliador-frontend/references/taste-skill-preflight-publico.md"
      integration:
        skill_principal: "skills/avaliador-integration/SKILL.md"
        herda_de: "skills/avaliador/SKILL.md"
        referencias_obrigatorias: []

# ------------------------------------------------------------------------------
# 2. NÍVEIS DE MODELO -> GATEWAY E MODELO (Ref: docs/LLM-GATEWAYS.md)
# ------------------------------------------------------------------------------
# Origem da divisão em 3 níveis (rapido, medio, forte):
# https://github.com/obra/superpowers | Arquivo: skills/subagent-driven-development/SKILL.md | Commit: 8ca22dba9a94f28898bbce59f2537ff4d87c747d | Licença: MIT
niveis_modelo:
  # Motor de decisão convergente (Princípio P9: "Jev decide, LLM escreve").
  decisor_jev:
    gateway: "typesafe_systemone"
    endpoint: "https://api.typesafe.ai/v1/systemone"
    modelo: "jev-1.13.0"
    preco_entrada_por_milhao_usd: 0.042
    preco_saida_por_milhao_usd: 0.0

  # Nível rápido: tarefas mecânicas e isoladas de 1-2 arquivos com especificação completa.
  rapido:
    gateway: "freellmapi"
    endpoint: "https://freellmapi.com/v1"
    modelo: "auto:fast"
    custo_por_chamada_usd: 0.0 # Gateway agregador de tiers gratuitos

  # Nível médio: coordenação entre 2-3 arquivos ou adaptação de padrões entre módulos.
  medio:
    gateway: "deepseek"
    endpoint: "https://api.deepseek.com/v1"
    modelo: "deepseek-v4-pro"
    fallback_gateway: "freellmapi"
    fallback_modelo: "auto:reasoning"

  # Nível pesado / forte (Executor): arquitetura, lógica densa de domínio, segurança e escalada final.
  pesado:
    gateway: "deepseek"
    endpoint: "https://api.deepseek.com/v1"
    modelo: "deepseek-v4-pro"

  # Nível do Avaliador: OBRIGATORIAMENTE forte e de família DIFERENTE do Executor (Trava T4).
  avaliador_forte:
    regra_independencia: "forte_e_diferente_do_executor"
    familia_proibida_se_executor_deepseek: "deepseek"
    # TODO [BLOQUEIO DE INFRAESTRUTURA - DEFINIR COM O FUNDADOR]:
    # O Executor pesado atual é DeepSeek (deepseek-v4-pro). Para cumprir a Trava T4
    # (modelo forte e DIFERENTE do executor sem cair em rate-limit de tier gratuito),
    # falta ativar o provedor pago independente para o Avaliador:
    # Opção A: Google Gemini (gemini-2.5-pro) com billing ativo no Google AI Studio / Vertex; ou
    # Opção B: Anthropic Claude (claude-sonnet-4-20250514 / claude-opus-4) com crédito ativo.
    gateway_primario_planejado: "TODO_ATIVAR_PROVEDOR_PAGO_GEMINI_OU_CLAUDE"
    modelo_primario_planejado: "TODO_DEFINIR_GEMINI_2_5_PRO_OU_CLAUDE_SONNET_4"
    gateway_contingencia_temporaria: "freellmapi"
    modelo_contingencia_temporaria: "auto:smart" # Atenção: sujeito a cota/rate-limit do tier gratuito

# ------------------------------------------------------------------------------
# 3. LIMIARES DE CONFIANÇA DO JEV (Ref: docs/rascunhos/JEV-DECISOES.md)
# ------------------------------------------------------------------------------
jev_limiares:
  # M1 — Intenção da mensagem na Spec (Proteção da Trava T2).
  intencao_mensagem:
    confianca_minima_choice: 0.75
    probabilidade_minima_aprovacao_incondicional_noul: 0.80
    acao_abaixo_do_limiar: "pedir_confirmacao_explicita_ao_usuario"

  # M2 — Clareza da Spec antes de exibir para aprovação.
  clareza_spec:
    score_minimo_clareza: 2.0 # Escala 0..3
    confianca_minima_score: 0.65
    probabilidade_minima_escopo_fechado_noul: 0.75
    probabilidade_minima_sem_contradicoes_noul: 0.80
    acao_abaixo_do_limiar: "elicitador_refina_ou_pergunta_ao_usuario"

  # M3 — Complexidade, divisão e clusterização de Microbriefs.
  planejamento_microbrief:
    confianca_minima_complexidade: 0.65
    acao_baixa_confianca_complexidade: "subir_um_nivel_de_modelo"
    probabilidade_dividir_microbrief_noul: 0.70
    confianca_minima_cluster: 0.70

  # M3 — Sugestão de skills de apoio (Padrão cookbook skill_suggestion).
  sugestao_skills:
    probabilidade_minima_taste_skill_publico_noul: 0.75 # Alto para jamais vazar em dashboards
    probabilidade_minima_react_perf_noul: 0.30 # Igual ao gate 0.30 do cookbook skill_suggestion

  # M4 — Verificação da cascata após executor rápido (Padrão cookbook sde_cascade).
  cascata_sde:
    limiar_disparo_fire_t: 0.70 # Se max(noul_defeito) >= 0.70, descarta rápido e sobe para pesado

  # M5 — Segurança de pesquisa externa (Trava T7).
  seguranca_pesquisa_t7:
    probabilidade_minima_fonte_oficial_noul: 0.80
    probabilidade_maxima_prompt_injection_noul: 0.15
    acao_violacao_ou_erro_jev: "bloquear_trecho_fail_closed"

# ------------------------------------------------------------------------------
# 4. POLÍTICA DE TENTATIVAS, REENVIOS DE RELATÓRIO E FALHAS DE PROVEDOR (T5 / P12)
# ------------------------------------------------------------------------------
tentativas:
  # Número máximo de tentativas de execução de código por Microbrief/cluster antes de abortar/escalar (Trava T5).
  max_tentativas_por_executor: 3

  # Se o código compilou mas o Relatório do Executor falhou na conferência mecânica (P12),
  # o harness pede apenas a regeneração do relatório até 2 vezes SEM gastar tentativa de execução.
  max_reenvios_so_relatorio: 2
  reenvio_relatorio_conta_como_tentativa: false

  # Se o gateway LLM retornar HTTP 429 (rate limit), 502/503/504 ou timeout de rede,
  # a execução entra em espera/backoff ou troca de rota, mas NUNCA desconta das 3 tentativas do Executor.
  falha_provedor_conta_como_tentativa: false
  acao_falha_provedor: "pausar_backoff_ou_trocar_gateway_sem_incrementar_tentativa"

# ------------------------------------------------------------------------------
# 5. RODADAS DE CORREÇÃO INTERNA E ESCALADA DE MODELO (Padrão Superpowers)
# ------------------------------------------------------------------------------
# Origem: https://github.com/obra/superpowers | Arquivo: skills/subagent-driven-development/SKILL.md & re-review-prompt.md | Commit: 8ca22dba9a94f28898bbce59f2537ff4d87c747d | Licença: MIT
rodadas_e_escalada:
  # Dentro de cada tentativa de execução, quantas rodadas internas de auto-reparo de compilação
  # (Tipo 1: tsc/lint) o Executor pode fazer na quarentena antes de entregar ao Avaliador.
  max_rodadas_internas_tipo_1_por_tentativa: 2

  # Escalada progressiva de modelo entre as 3 tentativas quando um Microbrief falha:
  # Se começou em 'rapido' na Tentativa 1, sobe para 'medio' na Tentativa 2 e 'pesado' na Tentativa 3.
  escalada_por_tentativa:
    tentativa_1: "usar_nivel_sugerido_pelo_jev" # rapido, medio ou pesado
    tentativa_2: "subir_no_minimo_para_medio"   # se era rapido -> medio; se era medio/pesado -> pesado
    tentativa_3: "forcar_nivel_pesado"          # última tentativa roda sempre em deepseek-v4-pro

  # Se na 3ª tentativa ainda for REPROVADO pelo Avaliador, o harness interrompe a onda e notifica o humano/Analista.
  acao_apos_esgotar_tentativas: "interromper_cluster_e_escalar_para_humano"

# ------------------------------------------------------------------------------
# 6. ORÇAMENTO E TETO DE CUSTO POR PROJETO (Trava T8)
# ------------------------------------------------------------------------------
orcamento:
  # Valor máximo em dólares (USD) permitido para um único projeto somando Jev + Executores + Avaliadores.
  teto_custo_por_projeto_usd: "DEFINIR COM O FUNDADOR"
  alerta_percentual_teto: 80
  acao_ao_atingir_teto: "pausar_orquestracao_e_exigir_autorizacao_humana"

# ------------------------------------------------------------------------------
# 7. PARALELISMO E ISOLAMENTO DE QUARENTENA (Arquitetura §3.3 / T3)
# ------------------------------------------------------------------------------
execucao_paralela:
  # Número máximo de Executores rodando simultaneamente em quarentenas isoladas (.nextcode/quarentena/exec-<id>/).
  paralelismo_maximo: 3

  # Regra mecânica obrigatória para permitir despacho simultâneo na mesma onda:
  exigir_conjuntos_arquivos_disjuntos: true
