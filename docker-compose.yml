services:
  nextcode-app:
    # Fora do "docker compose up" padrão: o NextCode roda no host (npm run dev). Este
    # container monta o MESMO prisma/dev.db e, ao reiniciar, subiria um segundo worker de
    # fila no mesmo banco. Use "docker compose --profile app up -d" só para rodar o app
    # inteiro em container (e pare o npm run dev antes).
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextcode-app
    ports:
      # Vinculado só a loopback: a app assume "localhost" como fronteira de confiança
      # (ver local-auth.ts). Expor em 0.0.0.0 publicaria o token de auth na rede.
      - "127.0.0.1:3001:3001"
    depends_on:
      - omniroute
    volumes:
      - .:/app
      - /app/node_modules
      - ./prisma:/app/prisma
      - sqlite_data:/app/prisma/data
      # Fase 5 (opcional): para montar o JAIL real do terminal, descomente as duas
      # linhas abaixo DENTRO do bloco volumes. AVISO: montar o socket Docker dá ao
      # container poder equivalente a root no host — use apenas se confiar no uso do
      # terminal do NextCode e preferencialmente com um socket proxy (e.g. tecnativa/docker-socket-proxy)
      # restringindo a criação de containers.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Relativo à pasta do schema.prisma (/app/prisma), igual ao .env do host.
      - DATABASE_URL=file:./dev.db
      - NODE_ENV=development
      - PORT=3001
      - IS_DOCKER=true
      - OMNIROUTE_URL=http://omniroute:20128/v1
      - NEXTCODE_SANDBOX_JAIL=on
      # Sem isto o next dev escuta só no loopback DO CONTAINER e o mapeamento de porta nunca responde.
      - NEXTCODE_DEV_HOST=0.0.0.0
    restart: unless-stopped

  omniroute:
    # FIX (queda do OmniRoute): o default da imagem é OMNIROUTE_MEMORY_MB=1024 e a
    # documentação oficial exige heap maior + limite de cgroup acima do heap para
    # cargas de agente de código — sem isso o processo morre com
    # "FATAL ERROR: Reached heap limit" (OOM) exatamente no padrão de uso do NextCode
    # (contextos longos via /v1/chat/completions). Fonte: README "Docker" e
    # docs/reference/ENVIRONMENT.md (OMNIROUTE_MEMORY_MB).
    # E6 (mudança 44): versão fixa por digest (consultado no registro em 22/10/2026); trocar só de propósito.
    image: diegosouzapw/omniroute@sha256:b08a12e876baa8a5ccadd1ebbe346fe7267dba3b1c9f4fd6bb02070fae41ab6c
    container_name: nextcode-omniroute
    stop_grace_period: 40s
    ports:
      # E6 (mudança 44): só loopback, como os outros serviços (antes publicava em todas as interfaces).
      - "127.0.0.1:20128:20128"
    environment:
      - PORT=20128
      - OMNIROUTE_MEMORY_MB=8192
    mem_limit: 10g
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      # /healthz é o probe de readiness recomendado pela doc (liveness: /livez);
      # timeouts curtos contra /api/monitoring/health reiniciam o container indevidamente.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  freellmapi:
    # Gateway de LLM gratuito (34 provedores, fallback com cooldown e cota por chave).
    # Rota primária do NextCode; o OmniRoute é a segunda rota (ver docs/LLM-GATEWAYS.md).
    # Porta 3100 no host: a 3001 (padrão da imagem) é a do NextCode.
    # E6 (mudança 44): versão fixa — o digest da imagem em uso nesta máquina em 22/10/2026.
    image: ghcr.io/tashfeenahmed/freellmapi@sha256:7d0334cb683aa693d3743549da914bf8500aaf3cdc091c73b5b508c21c7b4aab
    container_name: nextcode-freellmapi
    env_file:
      - .env.freellmapi
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3100:3001"
    volumes:
      - freellmapi-data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  freellmapi-data:
    driver: local
  sqlite_data:
    driver: local
  omniroute-data:
    driver: local