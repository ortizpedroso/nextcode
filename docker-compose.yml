services:
  nextcode-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextcode-app
    ports:
      # Vinculado só a loopback: a app assume "localhost" como fronteira de confiança
      # (ver local-auth.ts). Expor em 0.0.0.0 publicaria o token de auth na rede.
      - "127.0.0.1:3001:3001"
    depends_on:
      - omniroute
    volumes:
      - .:/app
      - /app/node_modules
      - ./prisma:/app/prisma
      - sqlite_data:/app/prisma/data
      # Fase 5 (opcional): para montar o JAIL real do terminal, descomente as duas
      # linhas abaixo DENTRO do bloco volumes. AVISO: montar o socket Docker dá ao
      # container poder equivalente a root no host — use apenas se confiar no uso do
      # terminal do NextCode e preferencialmente com um socket proxy (e.g. tecnativa/docker-socket-proxy)
      # restringindo a criação de containers.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - NODE_ENV=development
      - PORT=3001
      - IS_DOCKER=true
      - OMNIROUTE_URL=http://omniroute:20128/v1
      - NEXTCODE_SANDBOX_JAIL=on
    restart: unless-stopped

  omniroute:
    # FIX (queda do OmniRoute): o default da imagem é OMNIROUTE_MEMORY_MB=1024 e a
    # documentação oficial exige heap maior + limite de cgroup acima do heap para
    # cargas de agente de código — sem isso o processo morre com
    # "FATAL ERROR: Reached heap limit" (OOM) exatamente no padrão de uso do NextCode
    # (contextos longos via /v1/chat/completions). Fonte: README "Docker" e
    # docs/reference/ENVIRONMENT.md (OMNIROUTE_MEMORY_MB).
    image: diegosouzapw/omniroute:latest
    container_name: nextcode-omniroute
    stop_grace_period: 40s
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
      - OMNIROUTE_MEMORY_MB=8192
    mem_limit: 10g
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      # /healthz é o probe de readiness recomendado pela doc (liveness: /livez);
      # timeouts curtos contra /api/monitoring/health reiniciam o container indevidamente.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
  omniroute-data:
    driver: local